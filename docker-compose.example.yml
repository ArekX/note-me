# Example production setup behind an HTTPS reverse proxy.
# Copy to docker-compose.yml and replace noteme.example.com with your domain.
services:
    note-me:
        image: arekxv/note-me-go:latest
        container_name: note-me
        restart: unless-stopped
        ports:
            # Bound to localhost only — expose through your reverse proxy.
            # Drop the "127.0.0.1:" prefix if the proxy runs on another host.
            - "127.0.0.1:8000:8000" # webserver
        environment:
            # Must bind to 0.0.0.0 inside the container, otherwise ports are unreachable.
            SERVER_ADDRESS: 0.0.0.0
            WEBSERVER_PORT: 8000

            # Persist the database outside the container (see volumes below).
            DATABASE_DSN: sqlite:///app/data/database.sqlite

            # The websocket is served on /ws of the webserver, so the proxy
            # must forward websocket upgrades to port 8000.
            APP_URL: https://noteme.example.com

            # Address of the reverse proxy, so the login rate limit sees the
            # real client address from X-Forwarded-For.
            # TRUSTED_PROXIES: 172.16.0.0/12

            # Requires HTTPS; set to 0 only when serving over plain HTTP.
            COOKIE_SECURE: 1
            COOKIE_MAX_AGE_SECONDS: 2592000

            LOGGING_LEVEL: INFO
            SHOW_LOG_COLORS: 0

            # 50MB upload limit
            MAX_FILE_SIZE: 52428800

            # Daily backups to keep, 0 disables backups.
            MAX_ALLOWED_BACKUP_COUNT: 5

            # Every backup is encrypted with this secret; the server does not
            # start without it and a backup cannot be restored without it.
            BACKUP_ENCRYPTION_KEY: change-me

            # AI provider API keys are stored encrypted with this secret; the
            # server does not start without it.
            AI_ENCRYPTION_KEY: change-me-too

            # Root of every "local" backup target (see volumes below).
            LOCAL_BACKUP_ROOT_LOCATION: /app/backup
        volumes:
            # SQLite database.
            - ./data:/app/data
            # Uploaded files (FILES_LOCATION, /app/files by default).
            - ./files:/app/files
            # Root of the "local" backup targets: a target whose location is
            # "nightly" writes to ./backup/nightly on the host.
            - ./backup:/app/backup
        healthcheck:
            # noteme-cli ships its own health check so the distroless image
            # does not need curl or a shell.
            test: ["CMD", "/app/noteme-cli", "healthcheck"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 15s
